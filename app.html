<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playlist Bridge</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="hero" id="hero">
    <div class="hero-inner">
      <div class="cover" id="hero-cover" aria-hidden="true">♪</div>
      <div class="hero-text">
        <div class="eyebrow" id="hero-eyebrow">播放清單轉換</div>
        <h1 id="hero-title">Playlist Bridge</h1>
        <div class="hero-meta" id="hero-meta"></div>
      </div>
    </div>
  </header>

  <main>
    <section class="controls">
      <input id="src-url" class="input" type="url" placeholder="貼上播放清單連結" autocomplete="off">
      <div class="controls-row">
        <label class="target">
          <span>轉到</span>
          <select id="target" class="input">
            <option value="ytmusic">YouTube Music</option>
            <option value="youtube">YouTube</option>
            <option value="spotify">Spotify</option>
          </select>
        </label>
        <input id="pl-name" class="input grow" type="text" placeholder="新清單名稱">
      </div>
      <div class="buttons">
        <button id="btn-load" class="btn primary">讀取</button>
        <button id="btn-match" class="btn primary" hidden>開始配對</button>
        <button id="btn-create" class="btn primary" hidden>建立播放清單</button>
        <button id="btn-stop" class="btn ghost" hidden>停止</button>
      </div>
    </section>

    <section class="progress" id="progress" hidden>
      <div class="steps">
        <div class="step" data-step="load">
          <div class="step-head"><span>讀取</span><span class="step-count"></span></div>
          <div class="bar"><div class="bar-fill"></div></div>
        </div>
        <div class="step" data-step="match">
          <div class="step-head"><span>配對</span><span class="step-count"></span></div>
          <div class="bar"><div class="bar-fill"></div></div>
        </div>
        <div class="step" data-step="create">
          <div class="step-head"><span>建立</span><span class="step-count"></span></div>
          <div class="bar"><div class="bar-fill"></div></div>
        </div>
      </div>
      <div class="action">
        <span class="spinner" id="spinner" hidden></span>
        <span id="action-text"></span>
        <span id="action-time" class="action-time"></span>
      </div>
    </section>

    <section class="alert" id="error" hidden>
      <div class="alert-text">
        <strong id="error-msg"></strong>
        <span id="error-hint"></span>
      </div>
      <button class="btn ghost small" data-copy-report>複製錯誤回報</button>
    </section>

    <section class="done" id="done" hidden>
      <span id="done-text"></span>
      <a id="done-link" class="btn primary small" target="_blank" rel="noreferrer">開啟</a>
    </section>

    <section class="tracks" id="tracks" hidden>
      <div class="tracks-bar">
        <div class="chips">
          <button class="chip active" data-filter="all">全部 <b id="c-all">0</b></button>
          <button class="chip" data-filter="uncertain">需確認 <b id="c-uncertain">0</b></button>
          <button class="chip" data-filter="notfound">找不到 <b id="c-notfound">0</b></button>
        </div>
        <div class="tools" id="tools" hidden>
          <button class="btn ghost small" id="btn-csv">下載 CSV</button>
          <button class="btn ghost small" id="btn-copy-missing">複製未加入</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th class="c-num">#</th>
            <th>標題</th>
            <th class="c-pick">配對結果</th>
            <th class="c-state">狀態</th>
            <th class="c-dur">時長</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <footer>
      <details id="log-panel">
        <summary>執行紀錄</summary>
        <pre id="log"></pre>
      </details>
      <button class="link" data-copy-report>複製錯誤回報</button>
    </footer>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
